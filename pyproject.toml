[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghijo"
version = "0.1.0"
description = "Inert GitHub source for an authorized PyPI VCS dependency experiment"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
